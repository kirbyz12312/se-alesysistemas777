<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gradUni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadowUni" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#gradUni)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="80" cy="80" r="66" fill="#0b1329" stroke="url(#gradUni)" stroke-width="2.5" filter="url(#shadowUni)"/>
  
  <!-- Escudo heráldico / Libro y Átomo -->
  <path d="M50 46 C50 38, 110 38, 110 46 C110 80, 80 112, 80 112 C80 112, 50 80, 50 46 Z" 
        fill="#111c44" stroke="#38bdf8" stroke-width="2.5"/>
  
  <!-- Símbolos: Libro del saber + Estrella -->
  <path d="M60 74 Q80 82 80 92 Q80 82 100 74 L100 58 Q80 66 80 76 Q80 66 60 58 Z" 
        fill="#38bdf8" opacity="0.9"/>
  <circle cx="80" cy="54" r="4.5" fill="#fbbf24"/>
  
  <!-- Laurel / Guirnalda estilizada -->
  <path d="M42 88 C38 70, 45 53, 52 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M118 88 C122 70, 115 53, 108 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  
  <text x="80" y="130" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">UNSA</text>
  <text x="80" y="143" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">UNIVERSIDAD NACIONAL DE SAN AGUSTÍN</text>
</svg>
