<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gradTel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadowTel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#gradTel)" stroke-width="3" stroke-dasharray="6 3" opacity="0.7"/>
  <circle cx="80" cy="80" r="66" fill="#0b1329" stroke="url(#gradTel)" stroke-width="2.5" filter="url(#shadowTel)"/>
  
  <!-- Torre de Telecomunicaciones y Ondas Electromagnéticas -->
  <!-- Ondas concéntricas -->
  <circle cx="80" cy="53" r="14" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="80" cy="53" r="24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 3" opacity="0.8"/>
  <circle cx="80" cy="53" r="34" fill="none" stroke="#22d3ee" stroke-width="2.2" opacity="0.5"/>
  
  <!-- Antena / Torre -->
  <polygon points="80,46 70,93 90,93" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="72" y1="68" x2="88" y2="68" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="75" y1="80" x2="85" y2="80" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="80" cy="46" r="4.5" fill="#f43f5e"/>
  
  <!-- Señal senoidal en la base -->
  <path d="M50 104 Q57.5 96 65 104 T80 104 T95 104 T110 104" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="80" y="128" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">EPIT - UNSA</text>
  <text x="80" y="142" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#67e8f9" text-anchor="middle" letter-spacing="1">ING. EN TELECOMUNICACIONES</text>
</svg>
